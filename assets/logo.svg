<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0d121b"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c46b"/>
      <stop offset="1" stop-color="#e08a35"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- door -->
  <rect x="104" y="104" width="304" height="304" rx="44" fill="none" stroke="url(#g)" stroke-width="24"/>
  <!-- hinges -->
  <rect x="84" y="160" width="28" height="52" rx="10" fill="url(#g)"/>
  <rect x="84" y="300" width="28" height="52" rx="10" fill="url(#g)"/>
  <!-- wheel: six arms with knobs -->
  <g stroke="url(#g)" stroke-width="20" stroke-linecap="round">
    <line x1="256" y1="176" x2="256" y2="336"/>
    <line x1="187" y1="216" x2="325" y2="296"/>
    <line x1="187" y1="296" x2="325" y2="216"/>
  </g>
  <g fill="#f7c46b">
    <circle cx="256" cy="168" r="20"/><circle cx="256" cy="344" r="20"/>
    <circle cx="180" cy="212" r="20"/><circle cx="332" cy="300" r="20"/>
    <circle cx="180" cy="300" r="20"/><circle cx="332" cy="212" r="20"/>
  </g>
  <circle cx="256" cy="256" r="42" fill="#121925" stroke="url(#g)" stroke-width="20"/>
  <circle cx="256" cy="256" r="11" fill="#f7c46b"/>
</svg>
