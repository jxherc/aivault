version: 2
project_name: aivault

builds:
  - main: ./cmd/aivault
    binary: aivault
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # names people recognize: macos not darwin, x64 not amd64
    name_template: >-
      {{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ if eq .Os "darwin" }}{{ if eq .Arch "arm64" }}apple-silicon{{ else }}intel{{ end }}{{ else if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

release:
  github:
    owner: jxherc
    name: aivault
  header: |
    mac and linux:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/jxherc/aivault/main/install.sh | sh
    ```

    windows (powershell):

    ```powershell
    irm https://raw.githubusercontent.com/jxherc/aivault/main/install.ps1 | iex
    ```

    already have it: `aivault update`

    or download the file for your computer:

    | | |
    | --- | --- |
    | mac (m1 or newer) | [aivault-macos-apple-silicon.tar.gz](https://github.com/jxherc/aivault/releases/download/{{ .Tag }}/aivault-macos-apple-silicon.tar.gz) |
    | mac (intel) | [aivault-macos-intel.tar.gz](https://github.com/jxherc/aivault/releases/download/{{ .Tag }}/aivault-macos-intel.tar.gz) |
    | windows | [aivault-windows-x64.zip](https://github.com/jxherc/aivault/releases/download/{{ .Tag }}/aivault-windows-x64.zip) |
    | windows on arm | [aivault-windows-arm64.zip](https://github.com/jxherc/aivault/releases/download/{{ .Tag }}/aivault-windows-arm64.zip) |
    | linux | [aivault-linux-x64.tar.gz](https://github.com/jxherc/aivault/releases/download/{{ .Tag }}/aivault-linux-x64.tar.gz) |
    | linux on arm | [aivault-linux-arm64.tar.gz](https://github.com/jxherc/aivault/releases/download/{{ .Tag }}/aivault-linux-arm64.tar.gz) |

    a mac file downloaded in a browser needs `xattr -d com.apple.quarantine aivault` once, because the binary isn't signed yet.

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  # titles look like "(fix) main general: hooks: ...". keep what's after the first ": "
  format: '{{ trimprefix .Message (printf "%s: " (index (split .Message ": ") 0)) }}'
  filters:
    include: ['^\((new|change|remove|fix)\)']
  groups:
    - title: new
      regexp: '^\(new\)'
      order: 0
    - title: changes
      regexp: '^\((change|remove)\)'
      order: 1
    - title: fixes
      regexp: '^\(fix\)'
      order: 2

# one token with write access to both repos below. the default actions
# token can't push to other repos
homebrew_casks:
  - name: aivault
    repository:
      owner: jxherc
      name: homebrew-tap
      token: '{{ envOrDefault "TAP_TOKEN" "" }}'
    # without the token the release still happens, just without the tap
    skip_upload: '{{ if envOrDefault "TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/jxherc/aivault
    description: one folder of rules, skills and memory for all your ai coding tools
    # the binary isn't signed or notarized yet, so macos would block it.
    # drop this once it's signed
    hooks:
      post:
        # `install` works on 2.18 and later. newer docs call it install_steps
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aivault"]
          end

scoops:
  - name: aivault
    repository:
      owner: jxherc
      name: scoop-bucket
      token: '{{ envOrDefault "TAP_TOKEN" "" }}'
    skip_upload: '{{ if envOrDefault "TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/jxherc/aivault
    description: one folder of rules, skills and memory for all your ai coding tools
    license: MIT
